spring:
  application:
    name: notification-system

  datasource:
    url: jdbc:postgresql://localhost:5432/notification
    username: notification
    password: notification

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
